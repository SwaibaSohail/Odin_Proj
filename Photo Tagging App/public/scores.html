<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High scores · Where's Mabel?</title>
    <meta name="description" content="A Where's Waldo style game. Find Mabel and her friends in three crowded pictures, against the clock.">
    <script>
        try {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme) document.documentElement.dataset.theme = savedTheme;
        } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/scores.js"></script>
</head>

<body>
    <header class="site-header">
        <a href="/" class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5v19q0 4-3.5 4Q10 28 10 25.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 16A13 11.5 0 0 1 29 16q-3.25-2.6-6.5 0-3.25-2.6-6.5 0-3.25-2.6-6.5 0Q6.25 13.4 3 16Z" fill="#d62828" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Where's Mabel?</a>
        <nav class="site-nav" aria-label="Main">
            <a href="/">Pictures</a>
            <a href="/scores" aria-current="page">High scores</a>
            <button type="button" class="theme-toggle" aria-label="Toggle dark mode">Dark</button>
        </nav>
    </header>

    <main>
        <h1 class="page-title">High scores</h1>
        <p class="page-lead">The ten fastest players to find everyone in each picture.</p>

        <div class="tabs" role="tablist" aria-label="Pictures" id="tabs"></div>
        <p class="status" id="status">Loading the scores...</p>

        <div class="card score-card" role="tabpanel" id="panel" hidden>
            <table class="score-table">
                <thead>
                    <tr>
                        <th scope="col" class="rank">#</th>
                        <th scope="col">Name</th>
                        <th scope="col">Time</th>
                        <th scope="col" class="misses">Misses</th>
                        <th scope="col" class="when">Date</th>
                    </tr>
                </thead>
                <tbody id="score-rows"></tbody>
            </table>
        </div>
        <p class="scene-actions"><a class="btn btn-primary" id="play-link" href="/" hidden>Play this picture</a></p>
    </main>

    <footer class="site-footer">Where's Mabel? is a photo tagging project for The Odin Project. The pictures were made for this game.</footer>
</body>

</html>
