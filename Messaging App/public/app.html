<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parley</title>
    <meta name="description" content="Parley is a small messaging app: direct messages, group chats, pictures and profiles.">
    <script src="/js/theme-init.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/app.js"></script>
</head>

<body class="app">
    <aside class="sidebar" aria-label="Chats and people">
        <header class="side-head">
            <a href="#/" class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H15l-7 6v-6H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" fill="currentColor"/><path d="M10 11.5h12M10 16.5h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>Parley</a>
            <button type="button" class="btn btn-small" id="new-group">New group</button>
        </header>

        <div class="tabs" role="tablist" aria-label="Lists">
            <button type="button" role="tab" id="tab-chats" aria-selected="true">Chats <span class="badge" id="unread-total" hidden></span></button>
            <button type="button" role="tab" id="tab-people" aria-selected="false">People</button>
        </div>

        <div class="search">
            <input type="search" id="search" placeholder="Search chats" aria-label="Search" autocomplete="off">
        </div>
        <p class="notice" id="offline" role="status" hidden>Can't reach the server. Trying again...</p>

        <ul class="list" id="list"></ul>
        <p class="empty" id="list-empty" hidden></p>

        <footer class="side-foot">
            <button type="button" class="me" id="me" title="Edit your profile"></button>
            <button type="button" class="theme-toggle" aria-label="Toggle dark mode">Dark</button>
            <button type="button" class="btn-plain" id="log-out">Log out</button>
        </footer>
    </aside>

    <main class="chat" id="chat">
        <section class="chat-empty" id="chat-empty">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H15l-7 6v-6H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" fill="currentColor"/><path d="M10 11.5h12M10 16.5h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
            <h2>Pick a chat</h2>
            <p>Choose a chat on the left, or find someone in People to start a new one.</p>
        </section>

        <section class="chat-open" id="chat-open" hidden>
            <header class="chat-head">
                <a class="back" href="#/">Back</a>
                <button type="button" class="chat-title" id="chat-title" title="See details"></button>
            </header>

            <div class="messages" id="messages" tabindex="0" aria-label="Messages">
                <button type="button" class="btn btn-small load-earlier" id="load-earlier" hidden>Load earlier messages</button>
                <ol class="message-list" id="message-list" aria-live="polite" aria-relevant="additions"></ol>
                <ol class="message-list" id="pending-list"></ol>
            </div>
            <button type="button" class="jump-new" id="jump-new" hidden>New messages</button>

            <form class="composer" id="composer">
                <div class="composer-inner">
                    <div class="attachment" id="attachment" hidden>
                        <img id="attachment-preview" alt="">
                        <span class="attachment-name" id="attachment-name"></span>
                        <button type="button" class="btn btn-small" id="attachment-remove">Remove</button>
                    </div>
                    <p class="composer-error" id="composer-error" role="alert"></p>
                    <div class="composer-row">
                        <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
                        <button type="button" class="icon-btn" id="attach" aria-label="Add a picture" title="Add a picture">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.7"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg>
                        </button>
                        <textarea id="text" rows="1" maxlength="2000" placeholder="Write a message" aria-label="Message"></textarea>
                        <button type="submit" class="btn btn-primary send" id="send" disabled>Send</button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <dialog class="dialog" id="dialog" aria-labelledby="dialog-title"></dialog>
    <dialog class="lightbox" id="lightbox" aria-label="Picture"></dialog>
</body>

</html>
