<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up · Parley</title>
    <meta name="description" content="Parley is a small messaging app: direct messages, group chats, pictures and profiles.">
    <script src="/js/theme-init.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/theme.js"></script>
    <script type="module" src="/js/auth.js"></script>
</head>

<body class="auth-page">
    <header class="auth-head">
        <a href="/" class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H15l-7 6v-6H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z" fill="currentColor"/><path d="M10 11.5h12M10 16.5h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>Parley</a>
        <button type="button" class="theme-toggle" aria-label="Toggle dark mode">Dark</button>
    </header>

    <main class="auth-main">
        <form class="auth-card" id="auth-form" data-mode="signup" novalidate>
            <h1>Create your account</h1>
            <p class="lead">It takes a few seconds, and there's no email to confirm.</p>
            <p class="form-message error" id="form-message" role="alert"></p>
            <div class="field">
                <label for="displayName">Your name</label>
                <input id="displayName" name="displayName" autocomplete="name" maxlength="40" autofocus required>
                <p class="hint">This is what other people see.</p>
                <p class="field-error" data-error-for="displayName"></p>
            </div>
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
                <p class="hint">3 to 20 letters, numbers or underscores.</p>
                <p class="field-error" data-error-for="username"></p>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>
                <p class="hint">At least 8 characters.</p>
                <p class="field-error" data-error-for="password"></p>
            </div>
            <button class="btn btn-primary" type="submit">Sign up</button>
            <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
        </form>
    </main>
</body>

</html>
